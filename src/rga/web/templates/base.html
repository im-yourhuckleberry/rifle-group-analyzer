<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rifle Group Analyzer{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/groups">Rifle Group Analyzer</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/groups"{% if active == 'groups' %} class="active" aria-current="page"{% endif %}>Groups</a>
      <a href="/rifles"{% if active == 'rifles' %} class="active" aria-current="page"{% endif %}>Rifles</a>
      <a href="/analysis"{% if active == 'analysis' %} class="active" aria-current="page"{% endif %}>Analysis</a>
      <a href="/compare"{% if active == 'compare' %} class="active" aria-current="page"{% endif %}>Compare loads</a>
      <a href="/dope"{% if active == 'dope' %} class="active" aria-current="page"{% endif %}>Dope</a>
      <a href="/settings"{% if active == 'settings' %} class="active" aria-current="page"{% endif %}>Settings</a>
    </nav>
  </header>
  <div id="flash" class="flash" role="alert" aria-live="polite" hidden></div>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
